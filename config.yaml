########### directories ###########
initialize_dir: storage/initialize/
downloaded_data_dir: storage/data/tmp/downloaded/
standardized_data_dir: storage/data/tmp/standardized/
query_results_dir: storage/data/tmp/query_results/


############ direct file paths ###########
interests: storage/data/tmp/interests.csv
requests: storage/data/tmp/requests.csv
downloaded_data: storage/data/tmp/downloaded/downloaded_data.jsonl
standardized_data: storage/data/tmp/standardized/standardized_metadata.jsonl

############ storage catalogs and products ###########
catalogs_dir: storage/data/catalogs
datasets_catalog: storage/data/catalogs/datasets.jsonl
grids_catalog: storage/data/catalogs/grids.jsonl
grids_dir: storage/data/catalogs/grids
bucket_lookup_dir: storage/data/bucket_lookup
products_dir: storage/data/products
product_index: storage/data/metadata.jsonl

############ combined dataset ###########
combined_dataset:
  enabled: true
  repository: polaris
  dataset: combined
  display_name: Combined — weighted mean of available datasets
  target_repository: copernicusclimatedatastore
  target_dataset: era5_single_level
  temporal_resolution: 1D
  minimum_daily_coverage: 0.75
  regridding_method: bilinear
  cache_dir: storage/data/regridding
  variables: [sea_surface_temperature]
  default_weight: 1.0
  weights: {}

############ canonical spatial container grid ###########
container_grid:
  lon_min: 0
  lat_min: -90
  lon_size: 60
  lat_size: 30

supported_coarseness_factors: [1, 2]

# Values accepted by storage queries. These are separate from the ingestion
# reducers below (aggregation methods), which describe how each scientific
# variable is coarsened.
supported_query_functions: [timeseries, heatmap, find-time, find-area, get-data]
function_aggregation_methods: [mean, min, max]

############ dictionaries ###########
name_docs: {
  "copernicusclimatedatastore": {
    "era5_single_level": {
      "display_name": "ERA5 Single Levels",
      "grid": {
        "type": "rectilinear",
        "name": "regular",
        "resolution": [0.25],
        "units": "degrees"
      },
      "variables": {
        "sst": "sea_surface_temperature"
      },
      "additional_parameters": {},
      "temporal_sampling": ["1H"]
    },
    "carra_height": {
      "display_name": "CARRA Height Levels",
      "grid": {
        "type": "projected",
        "name": "lambert-conformal",
        "resolution": [2.5],
        "units": "km"
      },
      "variables": {
        "sst": "sea_surface_temperature"
      },
      "additional_parameters": {
        "height": ["15m", "30m"],
