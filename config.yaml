frontend_titles:
  repository: {
    "copernicusclimatedatastore": "Copernicus Climate Data Store",
    "nasaearthdata": "NASA Earthdata",
    "noaancei": "NOAA National Centers for Environmental Information",
    "polaris": "Combined datasets"
  }
  variable: {
    "sea_surface_temperature": "Sea Surface Temperature"
  }
  resolution: {
    "0.25": {
      "source": [0.25],
      "coarsen-2": [0.5]
    },
    "2.5": {
      "source": [2.5],
      "coarsen-2": [5.0]
    }
  }

# Ingestion reducers describing how each scientific variable is coarsened.
aggregation_methods:
  sea_surface_temperature:
    temporal: mean
    spatial: mean
  precipitation:
    temporal: sum
    spatial: mean
